name: P4 Jandri authentic OSM downhill survey (non-publishing)

on:
  pull_request:
    paths:
      - 'tools/reality/jandri_osm_survey.py'
      - 'test/jandri_osm_survey_test.py'
      - 'tools/reality/jandri_svg.py'
      - 'docs/p4/JANDRI-OSM-MAP.svg'
      - 'docs/p4/JANDRI-OSM-INDEX.json'
      - '.github/workflows/p4-jandri-osm-survey.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify source traceability and no fake lines
        run: python3 -m unittest discover -s test -p 'jandri_osm_survey_test.py' -v
  pinned-jandri:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Recover genuine original July 2026 OSM snapshot
        uses: actions/download-artifact@v4
        with:
          name: p4-les-deux-alpes-osm-survey
          run-id: 44531317057
          github-token: ${{ github.token }}
          path: /tmp/p4-original-survey
      - name: Validate archived source SHA256 and draw all matched Jandri ways
        run: |
          set -eu
          echo '40dcc37e95a259fb7d0f036e10e4147ce9c7343fb69b167c23ec92241da5ff26  /tmp/p4-original-survey/p4-les-deux-alpes-osm.json' | sha256sum --check
          python3 tools/reality/jandri_osm_survey.py \
            --fixture /tmp/p4-original-survey/p4-les-deux-alpes-osm.json \
            --raw-out p4-evidence/jandri-overpass-original.json \
            --out p4-evidence/jandri-osm-index.json
          python3 tools/reality/jandri_svg.py \
            --index p4-evidence/jandri-osm-index.json \
            --out p4-evidence/jandri-osm-atlas.svg
      - name: Preserve audit artefacts for geodata review
        uses: actions/upload-artifact@v4
        with:
          name: p4-jandri-real-osm-network-survey
          path: p4-evidence/
          if-no-files-found: error
          retention-days: 90

  persist-atlas-to-pr:
    name: Preserve checked real Jandri coordinates in the repository
    needs: pinned-jandri
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: p4-jandri-real-osm-network-survey
          path: /tmp/jandri-verified
      - name: Version original verified Jandri geometry index and atlas
        run: |
          set -eu
          mkdir -p docs/p4
          cp /tmp/jandri-verified/jandri-osm-index.json docs/p4/JANDRI-OSM-INDEX.json
          cp /tmp/jandri-verified/jandri-osm-atlas.svg docs/p4/JANDRI-OSM-MAP.svg
          python3 - <<'PY'
          import json
          with open('docs/p4/JANDRI-OSM-INDEX.json') as f: d=json.load(f)
          assert d['originalResponseSHA256']=='40dcc37e95a259fb7d0f036e10e4147ce9c7343fb69b167c23ec92241da5ff26'
          assert d['snapshotTimestampUTC']=='2026-07-24T11:04:51Z'
          assert d['wayCount']==37
          assert len(d['features'])==37
          PY
          git add docs/p4/JANDRI-OSM-INDEX.json docs/p4/JANDRI-OSM-MAP.svg
          if git diff --cached --quiet; then
            echo 'Pinned atlas is already versioned'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(P4): preserve 37 verified Jandri OSM segments and atlas'
          git push origin HEAD:${{ github.head_ref }}
