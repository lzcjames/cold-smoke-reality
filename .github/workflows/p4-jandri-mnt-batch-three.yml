name: P4 Jandri IGN MNT third batch (non-publishing)

on:
  push:
    branches:
      - audit/jandri-mnt-batch-three
    paths:
      - 'tools/reality/jandri_mnt_batch_three.py'
      - 'test/jandri_mnt_batch_three_test.py'
      - '.github/workflows/p4-jandri-mnt-batch-three.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-six-new-rasters:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GDAL_CACHEMAX: '128'
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original official IGN WFS archive
        uses: actions/download-artifact@v4
        with:
          name: p4-jandri-mnt-metadata-only
          run-id: 44635187118
          github-token: ${{ github.token }}
          path: /tmp/jandri-wfs
      - name: Install ground raster verification dependencies
        timeout-minutes: 9
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends python3-gdal python3-numpy gdal-bin
      - name: Verify disjoint third batch and fixed download cap
        run: /usr/bin/python3 -m unittest discover -s test -p 'jandri_mnt_batch_three_test.py' -v
      - name: Download and validate six distinct authentic 0.5m IGN MNT tiles
        timeout-minutes: 21
        run: |
          mkdir -p p4-evidence /tmp/jandri-third-mnt
          /usr/bin/python3 tools/reality/jandri_mnt_batch_three.py \
            --wfs /tmp/jandri-wfs/jandri-ign-wfs-original.geojson \
            --metadata /tmp/jandri-wfs/jandri-mnt-metadata-coverage.json \
            --work /tmp/jandri-third-mnt \
            --out p4-evidence/jandri-mnt-third-batch-report.json
      - name: Retain numerical provenance only (never publish raw MNT rasters)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-jandri-third-six-real-mnt-audit
          path: p4-evidence/
          if-no-files-found: warn
          retention-days: 30
