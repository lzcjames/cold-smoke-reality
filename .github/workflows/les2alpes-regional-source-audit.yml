name: Les Deux Alpes regional OSM candidate survey (source only)

on:
  push:
    branches: [main]
    paths:
      - 'tools/reality/les2alpes_sharded_osm.py'
      - 'tools/reality/audit_osm_shards.cjs'
      - 'tools/reality/overpass_region_source.cjs'
      - 'tools/reality/index_regional_overpass.cjs'
      - 'data/reality/les-deux-alpes-sectors.json'
      - '.github/workflows/les2alpes-regional-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect independent WGS84 source quadrants, keeping failures explicit
        run: |
          python3 tools/reality/les2alpes_sharded_osm.py --out-dir regional-evidence
      - name: Build per-response attributed candidate indexes (never synthesize combined snapshot)
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          d=Path("regional-evidence")
          status=json.loads((d/"status.json").read_text())
          for item in status["shards"]:
              if item["status"]!="source_candidates_unreviewed" or item.get("namedDownhillWays",0)==0: continue
              out=d/(item["id"]+"-source-index.json")
              subprocess.run(["node","tools/reality/index_regional_overpass.cjs",
                  str(d/item["file"]),str(out),
                  *map(str,item["bboxWGS84"])],check=True)
              report=d/(item["id"]+"-gap-report.json")
              subprocess.run(["node","tools/reality/report_resort_inventory.cjs",
                  "data/reality/les-deux-alpes-sectors.json",str(out),str(report)],check=True)
              candidates=json.loads(report.read_text())
              if candidates["wholeResortSurveyComplete"] or candidates["approvedForGameplay"]:
                  raise RuntimeError("Unreviewed regional source falsely approved")
          print("Captured source quadrants:",status["numberOfIndependentResponses"],"/4")
          PY
          node tools/reality/audit_osm_shards.cjs \
            regional-evidence \
            regional-evidence/deduplicated-source-audit.json
      - name: Archive raw OSM, attributed candidates and unresolved gaps only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: les2alpes-regional-osm-candidates-not-approved
          path: regional-evidence/
          if-no-files-found: warn
          retention-days: 30
