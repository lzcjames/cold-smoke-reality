name: Web validation and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p4_survey:
    name: P4 OSM survey (advisory, real data only)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 12
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Fetch timestamped Les Deux Alpes OSM ways from public Overpass
        timeout-minutes: 5
        run: |
          mkdir -p research
          python3 tools/reality/p4_osm.py \
            --bbox 44.98 6.10 45.06 6.22 \
            --out research/p4-osm-snapshot.json \
            --review research/p4-way-review.json
          python3 - <<'PY'
          import json
          r = json.load(open('research/p4-way-review.json'))
          print('OSM source timestamp:', r['timestampUTC'])
          print('Named downhill OSM ways:', r['surveyWays'])
          print('Shared OSM nodes:', len(r['sharedNodeWayIds']))
          for node, ids in list(r['sharedNodeWayIds'].items())[:18]:
              print('node', node, 'shared by actual OSM ways', ids)
          PY
      - name: Archive non-production OSM evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-les-deux-alpes-osm-survey
          path: research/
          if-no-files-found: warn

  gis:
    name: GIS importer checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GIS dependencies with retries (Ubuntu mirror may return 503)
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=5 &&
               sudo apt-get install -y -o Acquire::Retries=5 --no-install-recommends python3-gdal python3-numpy; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Ubuntu package mirrors failed after three attempts"
              exit 1
            fi
            sleep $((attempt * 12))
          done
      - name: Verify real-data importer and exact-node network geometry
        run: |
          /usr/bin/python3 -B test/reality-import.py
          /usr/bin/python3 -B test/p4-geodata.py
          /usr/bin/python3 -B -m unittest discover -s test -p 'measured_resort_grid_staging_test.py' -v

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      asset_sha: ${{ steps.stage.outputs.asset_sha }}
      p4_sha: ${{ steps.stage.outputs.p4_sha }}
      jandri_sha: ${{ steps.stage.outputs.jandri_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Restore validated separate Les Deux Alpes resort data
        if: hashFiles('data/reality/les-deux-alpes.json') == ''
        uses: actions/download-artifact@v4
        with:
          name: p4-unpublished-measured-les-deux-alpes
          run-id: 44548668423
          github-token: ${{ github.token }}
          path: /tmp/p4-verified-release
      - name: Verify source hash and stage real independently loaded resort
        run: |
          set -eu
          if [ ! -s data/reality/les-deux-alpes.json ]; then
            cp /tmp/p4-verified-release/unpublished-validation-only.json data/reality/les-deux-alpes.json
          fi
          echo '2915a1b89873a636255b4ccee14a7371e628638e8c37ced0b940213a25d990c3  data/reality/les-deux-alpes.json' | sha256sum --check
          node test/p4-measured-candidate.cjs data/reality/les-deux-alpes.json
      - run: npm run check
      - run: npm test
      - name: Audit published Les Deux Alpes geometry and evidence limitations
        run: node test/p4-truth-in-geometry.cjs
      - name: Browser regression with optional PR #10 visual captures
        env:
          BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          if [ "$PR_NUMBER" = "10" ]; then
            npm run test:browser -- --release --screenshots
          else
            npm run test:browser -- --release
          fi
      - name: Archive PR #10 real headless Chromium screenshots
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 10
        uses: actions/upload-artifact@v4
        with:
          name: pr10-headless-rendered-frames
          path: screenshots/pr10/
          if-no-files-found: warn
      - name: P3 3/10/50/100 piste browser stress (fresh Chromium process)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 11
        env:
          BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser -- --release --p3-only --screenshots
      - name: P3 synthetic 3/10/50/100 piste CPU and graphics allocation profiling
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 11
        run: node docs/p3/benchmark.cjs p3-scale-metrics.json
      - name: Upload P3 raw benchmark samples and real rendered frames
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 11
        uses: actions/upload-artifact@v4
        with:
          name: p3-piste-scale-profiling
          path: |
            p3-scale-metrics.json
            p3-browser-metrics.json
            screenshots/p3/
            screenshots/pr10/
          if-no-files-found: warn
      - name: Benchmark La Balme junction signs (PR #9 ABBA)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        env:
          BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node docs/reality-network/benchmark.mjs dist/dev.html dist/reality/alpe-dhuez.json junction-abba.json abba
          node -e "const d=require('./junction-abba.json'); console.log(JSON.stringify(d.frame.scenarios.map(s=>({distance:s.s, paired:s.paired})),null,2));"
      - name: Upload junction frame time samples
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        uses: actions/upload-artifact@v4
        with:
          name: junction-abba-profiling
          path: junction-abba.json
      - name: Stage website
        id: stage
        run: |
          test -s dist/dev.html
          grep -qi '<!doctype html>' dist/dev.html
          test -s dist/reality/alpe-dhuez.json
          test -s dist/reality/les-deux-alpes.json
          mkdir -p site
          cp dist/dev.html site/index.html
          cp -R dist/reality site/
          # A small independent piste atlas, NOT a playable new DEM pack.
          # Verify pinned real July 2026 OSM source and all 37 way geometries
          # before making the map visible to players.
          test -s docs/p4/JANDRI-OSM-INDEX.json
          test -s docs/p4/JANDRI-OSM-MAP.svg
          python3 - <<'PY'
          import json
          d=json.load(open('docs/p4/JANDRI-OSM-INDEX.json'))
          assert d['originalResponseSHA256']=='40dcc37e95a259fb7d0f036e10e4147ce9c7343fb69b167c23ec92241da5ff26'
          assert d['snapshotTimestampUTC']=='2026-07-24T11:04:51Z'
          assert d['wayCount']==37 and len(d['features'])==37
          assert {w['names'][0] for w in d['features']} == {
            'Jandri 1','Jandri 2','Jandri 3','Jandri 4','Balade du Jandri','Woops du Jandri'}
          PY
          cp docs/p4/JANDRI-OSM-MAP.svg site/reality/jandri-osm-map.svg
          echo "jandri_sha=$(sha256sum site/reality/jandri-osm-map.svg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          echo "asset_sha=$(sha256sum site/reality/alpe-dhuez.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "p4_sha=$(sha256sum site/reality/les-deux-alpes.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cold-smoke-web
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  persist_measured_pack:
    name: Persist verified licensed pack for future Pages rebuilds
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve only the validated game asset from this same CI run
        if: hashFiles('data/reality/les-deux-alpes.json') == ''
        uses: actions/download-artifact@v4
        with:
          name: cold-smoke-web
          path: /tmp/p4-pages-release
      - name: Keep 129 KB licensed JSON in the repository permanently
        run: |
          set -eu
          if [ ! -s data/reality/les-deux-alpes.json ]; then
            cp /tmp/p4-pages-release/reality/les-deux-alpes.json data/reality/les-deux-alpes.json
          fi
          echo '2915a1b89873a636255b4ccee14a7371e628638e8c37ced0b940213a25d990c3  data/reality/les-deux-alpes.json' | sha256sum --check
          git add data/reality/les-deux-alpes.json
          if git diff --cached --quiet; then
            echo 'Verified asset already persisted; no additional commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(P4): persist validated Les Deux Alpes LiDAR/OSM pack'
          git push origin HEAD:main

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify deployed website
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          ASSET_SHA: ${{ needs.validate.outputs.asset_sha }}
          P4_SHA: ${{ needs.validate.outputs.p4_sha }}
          JANDRI_SHA: ${{ needs.validate.outputs.jandri_sha }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors "${PAGE_URL}?v=${ASSET_SHA}" -o /tmp/cold-smoke-index.html
          grep -q 'id="view"' /tmp/cold-smoke-index.html
          grep -q 'data-reality-asset="available"' /tmp/cold-smoke-index.html
          curl --fail --silent --show-error --retry 6 --retry-all-errors "${PAGE_URL%/}/reality/alpe-dhuez.json?v=${ASSET_SHA}" -o /tmp/alpe-dhuez.json
          test -n "$ASSET_SHA"
          printf '%s  %s\n' "$ASSET_SHA" /tmp/alpe-dhuez.json | sha256sum --check
          curl --fail --silent --show-error --retry 6 --retry-all-errors "${PAGE_URL%/}/reality/les-deux-alpes.json?v=${P4_SHA}" -o /tmp/les-deux-alpes.json
          printf '%s  %s\n' "$P4_SHA" /tmp/les-deux-alpes.json | sha256sum --check
          grep -q 'reality/jandri-osm-map.svg' /tmp/cold-smoke-index.html
          curl --fail --silent --show-error --retry 6 --retry-all-errors "${PAGE_URL%/}/reality/jandri-osm-map.svg?v=${JANDRI_SHA}" -o /tmp/jandri-osm-map.svg
          printf '%s  %s\n' "$JANDRI_SHA" /tmp/jandri-osm-map.svg | sha256sum --check
