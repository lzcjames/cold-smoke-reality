name: Web validation and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      asset_sha: ${{ steps.stage.outputs.asset_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm run check
      - run: npm test
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal python3-numpy
          /usr/bin/python3 -B test/reality-import.py
      - run: npm run test:browser -- --release
        env:
          BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - name: Stage website
        id: stage
        run: |
          test -s dist/dev.html
          grep -qi '<!doctype html>' dist/dev.html
          test -s dist/reality/alpe-dhuez.json
          mkdir -p site
          cp dist/dev.html site/index.html
          cp -R dist/reality site/
          echo "asset_sha=$(sha256sum site/reality/alpe-dhuez.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cold-smoke-web
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify deployed website
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          ASSET_SHA: ${{ needs.validate.outputs.asset_sha }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors "${PAGE_URL}?v=${ASSET_SHA}" -o /tmp/cold-smoke-index.html
          grep -q 'id="view"' /tmp/cold-smoke-index.html
          grep -q 'data-reality-asset="available"' /tmp/cold-smoke-index.html
          curl --fail --silent --show-error --retry 6 --retry-all-errors "${PAGE_URL%/}/reality/alpe-dhuez.json?v=${ASSET_SHA}" -o /tmp/alpe-dhuez.json
          test -n "$ASSET_SHA"
          printf '%s  %s\n' "$ASSET_SHA" /tmp/alpe-dhuez.json | sha256sum --check
